spring:
  application:
    name: api-gateway
  security:
    user:
      name: disabled
      password: disabled
server:
  port: 8084

#Actuator config, health monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"

#Eureka DISCOVERY
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}


logging:
  level:
    org.springframework.cloud.gateway: TRACE


jwt:
  secret: ${JWT_SECRET}
