spring:
  application:
    name: api-gateway

  security:
    user:
      name: disabled
      password: disabled

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Make sure the Gateway handles browser preflight requests
      # before forwarding them to a microservice.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server:
  port: 8084

# Actuator config, health monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Eureka DISCOVERY
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    org.springframework.cloud.gateway: TRACE

jwt:
  secret: ${JWT_SECRET}